<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namely 2077 - AI Startup Name Generator</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app" class="app-container">
        <!-- Cyberpunk grid background -->
        <div class="grid-background"></div>
        
        <!-- Glowing orbs -->
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>

        <div class="content-wrapper">
            <!-- Header -->
            <div class="header">
                <h1 class="main-title">NAMELY 2077</h1>
                <p class="subtitle">AI-Powered Startup Name Generator // v2.077</p>
                <div class="status-badges">
                    <span class="badge badge-cyan">NEURAL NETWORK ACTIVE</span>
                    <span class="badge badge-purple">QUANTUM ENABLED</span>
                </div>
            </div>

            <!-- Form -->
            <div class="form-container">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">KEYWORDS // INPUT</label>
                        <input
                            type="text"
                            id="keywords"
                            placeholder="AI, blockchain, quantum..."
                            class="form-input"
                        />
                    </div>

                    <div class="form-group">
                        <label class="form-label">INDUSTRY // SECTOR</label>
                        <input
                            type="text"
                            id="industry"
                            placeholder="Tech, Healthcare, Finance..."
                            class="form-input"
                        />
                    </div>

                    <div class="form-group">
                        <label class="form-label">TONE // VIBE</label>
                        <select id="tone" class="form-select">
                            <option value="futuristic">Futuristic</option>
                            <option value="playful">Playful</option>
                            <option value="premium">Premium</option>
                            <option value="edgy">Edgy</option>
                            <option value="minimal">Minimal</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">LENGTH // SIZE</label>
                        <select id="length" class="form-select">
                            <option value="short">Short (≤8 chars)</option>
                            <option value="medium" selected>Medium (8-12 chars)</option>
                            <option value="long">Long (12+ chars)</option>
                        </select>
                    </div>
                </div>

                <button id="generateBtn" class="generate-btn">
                    <i data-lucide="zap"></i>
                    <span id="btnText">GENERATE NAMES</span>
                </button>
            </div>

            <!-- Results -->
            <div id="resultsSection" class="results-section" style="display: none;">
                <div class="results-header">
                    <h2 class="results-title">
                        <i data-lucide="sparkles"></i>
                        GENERATED // <span id="resultCount">0</span> RESULTS
                    </h2>
                    <button id="exportBtn" class="export-btn" style="display: none;">
                        <i data-lucide="download"></i>
                        EXPORT (<span id="favCount">0</span>)
                    </button>
                </div>

                <div id="namesGrid" class="names-grid"></div>
            </div>

            <!-- History -->
            <div id="historySection" class="history-section" style="display: none;">
                <h3 class="history-title">
                    <i data-lucide="trending-up"></i>
                    RECENT SESSIONS
                </h3>
                <div id="historyList" class="history-list"></div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <p>POWERED BY GennyTheDev</p>
                <p>© Namely 2077 </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
